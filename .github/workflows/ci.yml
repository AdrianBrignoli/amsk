name: CI/CD

on:
  push:
    branches: [refact]
  pull_request:
    branches: [refact]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Next.js build
        uses: actions/cache@v3
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Debug - Check ENV
        run: |
          if [ ! -z "$CONTENTFUL_SPACE_ID" ]; then
            echo "CONTENTFUL_SPACE_ID is set"
          else
            echo "CONTENTFUL_SPACE_ID is not set"
          fi
          if [ ! -z "$CONTENTFUL_ACCESS_TOKEN" ]; then
            echo "CONTENTFUL_ACCESS_TOKEN is set"
          else
            echo "CONTENTFUL_ACCESS_TOKEN is not set"
          fi

      - name: Build
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
